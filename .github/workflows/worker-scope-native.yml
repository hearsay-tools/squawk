name: Worker scope on native hosts
# ADR 0032: a worker's processes are owned through its scope. GitHub-hosted runners give the
# runner user no cgroup delegation, so the shared Vitest shards exercise only the `groups`
# backend. This job delegates one cgroup v2 subtree to the runner user, moves the test shell into
# it, and requires the `cgroup` cases to run, not skip.
on:
  pull_request:
    paths:
      - 'packages/cezar/src/worker-scope/**'
      - 'packages/cezar/src/core/session-process.ts'
      - 'packages/cezar/src/workflows/grouped-command.ts'
      - 'packages/cezar/src/workflows/run/worker-orphans.ts'
      - 'packages/cezar/src/delegation/worker-cleanup.ts'
      - '.github/workflows/worker-scope-native.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux-cgroup:
    name: Linux cgroup worker scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js from nodejs.org
        uses: ./.github/actions/node-dist
        with:
          node-version: '24.21.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          token: ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the scope tests inside a delegated cgroup
        run: |
          set -euo pipefail
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          base=/sys/fs/cgroup/squawk-ci
          sudo mkdir "$base"
          sudo chown -R "$(id -u):$(id -g)" "$base"
          # Moving into the delegated group needs root once; every later move stays inside it.
          echo $$ | sudo tee "$base/cgroup.procs" >/dev/null
          grep -qx "0::/squawk-ci" /proc/self/cgroup
          cd packages/cezar
          npx vitest run --reporter=verbose src/worker-scope 2>&1 | tee "$RUNNER_TEMP/scope.log"
          # The native cases skip without delegation; here they must have run.
          grep -q '✓ .*cgroup: stop ends a detached descendant after its leader exited' "$RUNNER_TEMP/scope.log"
          grep -q '✓ .*cgroup: kill ends the scope now' "$RUNNER_TEMP/scope.log"
          npx vitest run src/delegation/service-destroy src/workflows/worker-destroy src/delegation/scratch-cleanup
