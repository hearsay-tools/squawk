id: attention-bucket-compare-outside-owner
valid:
  # The owner's readers.
  - "const waiting = needsYou(run) ? 1 : 0"
  - "if (rungNeedsYou(task.rung)) return 'needsYou'"
  - "const rank = ATTENTION_RANK[deriveAttention(run).bucket]"
  # A CI check's bucket is another field with other names.
  - "const pending = checks.filter((check) => check.bucket === 'pending')"
  - "if (checks.some(c => c.bucket === 'fail')) return 'failed'"
  # A bucket compared with a value that is not a literal, and a literal that only contains a name.
  - "const row = rows.find(el => el.dataset.bucket === destination.label)"
  - "const odd = attention.bucket === 'waiting-on-workers'"
  # Another field that holds a bucket name.
  - "const parked = attention.tone === 'running'"
invalid:
  - "if (deriveAttention(run).bucket === 'waiting') return 'Needs you'"
  - "const waiting = attention.bucket !== \"permission\""
  - "const failed = members.some((run) => deriveAttention(run).bucket == 'error')"
  - "if ('waiting' === attention.bucket) count += 1"
  - "const quiet = attention?.bucket != 'none'"
  - "const live = state.attention.bucket === 'running' || state.attention.bucket === 'unseen'"

