id: subagent-children-outside-dock
valid:
  # The owner merges both views.
  - "const entries = subagentEntries(thread.turns, currentThread.turns, openAgentId)"
  - "const agent = findSubagent(currentThread.turns, openAgentId, runIsTerminal, thread.turns)"
  # A reference that is not a call, and a name that only contains it.
  - "import { subagentChildren } from './subagent-dock'"
  - "const entries = mySubagentChildren(turns, id)"
  - "const entries = dock.subagentChildrenOf(turns, id)"
invalid:
  - "const entries = subagentChildren(currentThread.turns, openAgentId)"
  - "const entries = useMemo(() => subagentChildren(thread.turns, id), [thread.turns, id])"
