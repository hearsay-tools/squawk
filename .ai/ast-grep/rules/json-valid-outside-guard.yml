id: json-valid-outside-guard
language: typescript
severity: warning
message: >-
  Guard SQL that reads stored JSON through `guardedJsonSql(sql, onBad, columns)`,
  packages/cezar/src/runs/guarded-json-sql.ts (hearsay-tools/squawk#3530). It writes the
  `json_valid` check once, so a row whose summary or data is not JSON answers `onBad` instead of
  failing the whole query.
files:
  - packages/*/src/**/*.ts
ignores:
  - packages/cezar/src/runs/guarded-json-sql.ts
  - packages/**/*.test.ts
  - packages/**/*.testkit.ts
# Text in a string or a template literal that calls `json_valid(`. SQL is written as string and
# template literals, so this sees every hand-written guard. It cannot see a guard assembled from
# pieces, such as `'json_' + 'valid('`, and it does not look for a `json_extract` left unguarded.
rule:
  kind: string_fragment
  regex: 'json_valid\s*\('
