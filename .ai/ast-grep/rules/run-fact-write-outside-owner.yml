id: run-fact-write-outside-owner
language: typescript
severity: warning
message: >-
  A run lifecycle fact has one owner that records it when the thing happens (ADR 0064,
  .ai/specs/2026-11-15-run-lifecycle-facts.md). `workflowCursor` and `parkReason` are written only
  by the exits' fields() in runs/run-exits.ts: for the cursor, name the step and the mode in the
  ExitCall (`{ stepId, cursor: 'start' | 'resume' }`) of the exit you move the run with.
  `continuesStepId` is written only by workflows/continuation-admission.ts, once, on the synthetic
  step a Continue admits. `doneAccepted` is recorded only by `recordDoneAccepted` in
  workflows/run/run-finish.ts; `retireDoneAccepted` and `spendDoneFreeTurn` in
  workflows/run/turn-settler.ts retire it and spend its free turn, all through
  RunStore.commitOutcome (`done-accepted`, `done-retired`, `done-free-turn`).
files:
  - packages/cezar/src/**/*.ts
  - packages/contract/src/**/*.ts
ignores:
  - packages/cezar/src/**/*.test.ts
  - packages/cezar/src/**/*.testkit.ts
  - packages/contract/src/**/*.test.ts
  - packages/contract/src/**/*.testkit.ts
  # The owner: each exit's fields() writes the cursor (cursorFields, enteredStep, succeeded) and the
  # park reason.
  - packages/cezar/src/runs/run-exits.ts
  # The owner of `continuesStepId`: `nextStep` records it on the synthetic step it admits.
  - packages/cezar/src/workflows/continuation-admission.ts
utils:
  run-fact: { regex: '^(workflowCursor|continuesStepId|parkReason|doneAccepted)$' }
  # The outcomes that record and retire `doneAccepted`, and the owner function of each.
  done-outcome: { kind: pair, all: [{ has: { field: key, regex: '^kind$' } }, { has: { field: value, regex: "^['\"]done-(accepted|retired|free-turn)['\"]$" } }] }
rule:
  all:
    - any:
        # `{ workflowCursor: … }` and `{ workflowCursor }` in a patch, a record or a spread.
        - { kind: pair, has: { field: key, matches: run-fact } }
        - { kind: shorthand_property_identifier, matches: run-fact }
        # `run.workflowCursor = …`
        - { kind: assignment_expression, has: { field: left, kind: member_expression, has: { field: property, matches: run-fact } } }
        # `{ kind: 'done-accepted', … }` and `{ kind: 'done-retired', … }`, staged for commitOutcome.
        - matches: done-outcome
    # Left out: a schema (`z.…`, `…Schema.…`), which declares the field. Reads, destructuring and
    # type members are other node kinds. A patch built under another name, or with a computed key,
    # is not seen: the rule sees literals.
    - not: { has: { field: value, regex: '^z\.|Schema\b|Schema\.' } }
    # The owners of `doneAccepted`: `recordDoneAccepted` (run-finish.ts) stages `done-accepted`,
    # `retireDoneAccepted` and `spendDoneFreeTurn` (turn-settler.ts) stage `done-retired` and
    # `done-free-turn`, and the outcome handlers in runs/outcome-commit.ts apply them to the row.
    - not:
        inside:
          stopBy: end
          any:
            - { kind: function_declaration, has: { field: name, regex: '^(recordDoneAccepted|retireDoneAccepted|spendDoneFreeTurn)$' } }
            - { kind: method_definition, has: { field: name, regex: "^['\"]done-(accepted|retired|free-turn)['\"]$" } }
    # The outcome type declares the kinds.
    - not: { inside: { stopBy: end, kind: type_alias_declaration } }
    # The read-time upgrades of a saved `workflowResumeStepId` and of a `doneAccepted` saved before its
    # identity facts (runs/legacy-run-rows.ts).
    - not:
        inside:
          stopBy: end
          kind: function_declaration
          has: { field: name, regex: '^(upgradeLegacyWorkflowCursor|upgradeLegacyDoneAccepted)$' }
