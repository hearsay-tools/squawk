id: nudge-fact-write-outside-owner
language: typescript
severity: warning
message: >-
  The nudge fact has one writer (ADR 0064, .ai/specs/2026-11-15-run-lifecycle-facts.md,
  hearsay-tools/squawk#2452): workflows/run/turn-nudges.ts records it when it sends or tries a
  nudge and retires it. Call `retireNudge(state)` from turn-nudges.ts instead of sending a
  `nudge-fact` boundary event.
files:
  - packages/cezar/src/**/*.ts
ignores:
  - packages/cezar/src/**/*.test.ts
  - packages/cezar/src/**/*.testkit.ts
  # The owner: recordNudge and retireNudge.
  - packages/cezar/src/workflows/run/turn-nudges.ts
rule:
  # `{ kind: 'nudge-fact', … }` in an object literal. The event's type member is a property
  # signature, another node kind. An event built under a computed key is not seen: the rule sees
  # literals.
  kind: pair
  all:
    - has: { field: key, regex: '^kind$' }
    - has: { field: value, regex: "^['\"`]nudge-fact['\"`]$" }
