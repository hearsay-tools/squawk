id: automations-capability-read-outside-owner-tsx
language: tsx
severity: warning
message: >-
  Ask the automations availability owner, packages/web/src/lib/capabilities.ts, instead of reading
  `capabilities.automations`: `useAutomationsAvailable()` in a component, `automationsAvailable(health)`
  where a health payload is already in hand, `useAutomationsAvailability()` where "not known yet"
  needs its own state (hearsay-tools/squawk#1401). A second reading drifts: the sidebar tab and the
  Tasks-page origin filter showed Automations while the nav hid it.
files:
  - packages/web/src/**/*.tsx
ignores:
  - packages/web/src/lib/capabilities.ts
  - packages/**/*.test.ts
  - packages/**/*.test.tsx
  - packages/**/*.testkit.ts
  - packages/**/*.testkit.tsx
# Keep this file and automations-capability-read-outside-owner.yml the same below `files`: ast-grep parses
# .ts and .tsx files with different grammars, so one rule cannot cover both.
# automations-capability-rule.test.ts compares them.
#
# Matches `<expr>.capabilities.automations` and `capabilities.automations`, optional chains
# included. The rule knows no types, so it keys on the two names. It leaves out a destructured
# `{ automations }` and a computed `capabilities['automations']`.
rule:
  kind: member_expression
  all:
    - has: { field: property, regex: '^automations$' }
    - has:
        field: object
        any:
          - { kind: identifier, regex: '^capabilities$' }
          - kind: member_expression
            has: { field: property, regex: '^capabilities$' }
