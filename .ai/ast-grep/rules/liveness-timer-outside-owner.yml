id: liveness-timer-outside-owner
language: typescript
severity: warning
message: >-
  Arm a run's liveness bound through LivenessTimers in
  packages/cezar/src/workflows/run/liveness-timers.ts (hearsay-tools/squawk#3662, ADR 0064): give the
  bound a row in LIVENESS_BOUNDS with its scope, call arm from a thin arm* method, and clear it with
  clear, clearScope or cancelLivenessTimer. A wait deadline goes to the wait engine (ADR 0061).
files:
  - packages/cezar/src/workflows/run/**/*.ts
  - packages/cezar/src/workflows/run.ts
ignores:
  - packages/cezar/src/workflows/run/**/*.test.ts
  - packages/cezar/src/workflows/run/**/*.testkit.ts
  - packages/cezar/src/workflows/run/liveness-timers.ts # The owner of every liveness bound.
  - packages/cezar/src/workflows/run/wait-engine.ts # Wait deadlines and checkpoint retries stay in the wait engine (ADR 0061).
  - packages/cezar/src/workflows/run/wait-watches.ts # The wait engine's deadline watch adapter (ADR 0061).
  - packages/cezar/src/workflows/run/worker-orphans.ts # The orphan reprobe and its awaited pauses belong to a worker generation's cleanup.
  - packages/cezar/src/workflows/run/worktree-autosave.ts # The autosave interval saves worktree evidence; it bounds no liveness.
# A call of setTimeout or setInterval, bare (a global or a node:timers import) or as a member
# (globalThis.setTimeout). A local awaited pause in another file takes a line-level
# `// ast-grep-ignore: liveness-timer-outside-owner` with its reason on the line above. The rule
# sees syntax only: a timer function under another name is not matched.
rule:
  kind: call_expression
  has:
    field: function
    any:
      - { kind: identifier, regex: '^(setTimeout|setInterval)$' }
      - { kind: member_expression, has: { field: property, regex: '^(setTimeout|setInterval)$' } }
